server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # Both JS spellings: which one mime.types uses for .js has changed between
  # nginx releases, and picking the wrong one silently ships the bundle raw.
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Every route is resolved in the browser, so anything that isn't a real file
  # falls back to the SPA shell rather than 404ing. There is deliberately no
  # `index` directive and no $uri/ branch: routing "/" through the same
  # fallback is what lets it pick up the no-cache header below.
  location / {
    try_files $uri /index.html;
  }

  # Hashed filenames: safe to keep forever.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The shell and the version manifest decide when a client picks up a new
  # deploy, so they must never be served stale.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /_app/version.json {
    add_header Cache-Control "no-cache";
  }
}
